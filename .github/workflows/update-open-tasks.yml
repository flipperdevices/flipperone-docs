name: Update Open-tasks page

on:
  schedule:
    # Hourly at :15 (offset from :00 to avoid the GitHub Actions runner-queue
    # spike that hits on every cron-aligned minute).
    - cron: "15 * * * *"
  workflow_dispatch:
  push:
    branches: [public-release]
    paths:
      - "tools/generate_open_tasks.py"
      - "tools/templates/**"
      - "requirements.txt"
      - ".github/workflows/update-open-tasks.yml"

# Don't let a manual dispatch race with the cron run.
concurrency:
  group: update-open-tasks
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

# public-release only accepts changes through pull requests, so the job can't
# push there directly (#367). It pushes the regenerated page to a fixed branch
# and opens one PR from it, refreshing that same PR on later runs.
env:
  PR_BRANCH: auto/open-tasks
  BASE_BRANCH: public-release

jobs:
  regenerate:
    if: github.repository == 'flipperdevices/flipperone-docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: public-release
          # Enable Actions PR creation in the repository settings for GITHUB_TOKEN.
          # Its PR workflows require approval. Set OPEN_TASKS_PR_TOKEN to a
          # PAT (contents + pull-requests write) to run checks automatically.
          token: ${{ secrets.OPEN_TASKS_PR_TOKEN || github.token }}

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Regenerate docs/Open-tasks.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/generate_open_tasks.py --out docs/Open-tasks.md

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.OPEN_TASKS_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          open_pr="$(gh pr list --head "$PR_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number')"
          if git diff --quiet -- docs/Open-tasks.md; then
            if [[ -n "$open_pr" ]]; then
              gh pr close "$open_pr"
            fi
            echo "Open-tasks.md is up to date — nothing to commit."
            exit 0
          fi
          # The generator compares against the base page, so a pending update
          # gets a fresh timestamp each run even when its task data is unchanged.
          if [[ -n "$open_pr" ]] \
             && git fetch --quiet origin "refs/heads/$PR_BRANCH" \
             && git diff --quiet --ignore-matching-lines='^updatedAt:' FETCH_HEAD -- docs/Open-tasks.md; then
            echo "PR #$open_pr already has this version — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One regenerated commit on top of the current base, replacing
          # whatever the branch held before, so the PR never accumulates history.
          git checkout -B "$PR_BRANCH"
          git add docs/Open-tasks.md
          git commit -m "Auto-update Open-tasks.md"
          git push --force origin "HEAD:refs/heads/$PR_BRANCH"
          if [[ -z "$open_pr" ]]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$PR_BRANCH" \
              --title "Auto-update Open-tasks.md" \
              --body "Regenerated by the Update Open-tasks page workflow. Later runs update this branch in place until it is merged."
          fi
